<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background black -->
  <rect width="1600" height="900" fill="#060608"/>

  <!-- Speed lines radiating from center -->
  <g stroke="rgba(255,255,255,0.07)" stroke-width="2">
    <line x1="800" y1="450" x2="0"    y2="0"/>
    <line x1="800" y1="450" x2="400"  y2="0"/>
    <line x1="800" y1="450" x2="800"  y2="0"/>
    <line x1="800" y1="450" x2="1200" y2="0"/>
    <line x1="800" y1="450" x2="1600" y2="0"/>
    <line x1="800" y1="450" x2="1600" y2="300"/>
    <line x1="800" y1="450" x2="1600" y2="600"/>
    <line x1="800" y1="450" x2="1600" y2="900"/>
    <line x1="800" y1="450" x2="1200" y2="900"/>
    <line x1="800" y1="450" x2="800"  y2="900"/>
    <line x1="800" y1="450" x2="400"  y2="900"/>
    <line x1="800" y1="450" x2="0"    y2="900"/>
    <line x1="800" y1="450" x2="0"    y2="600"/>
    <line x1="800" y1="450" x2="0"    y2="300"/>
  </g>

  <!-- Cyan glow halo behind headset -->
  <ellipse cx="800" cy="460" rx="340" ry="220" fill="none" stroke="rgba(95,209,249,0.12)" stroke-width="40" filter="url(#glow-cyan)"/>

  <!-- VR Headset body - main shape -->
  <!-- Outer shell -->
  <rect x="480" y="320" width="640" height="280" rx="40" fill="#e8eaf0" stroke="#111" stroke-width="8"/>
  <!-- Face foam/padding bottom -->
  <rect x="500" y="560" width="600" height="30" rx="15" fill="#c8cad0" stroke="#111" stroke-width="5"/>
  <!-- Top strap -->
  <rect x="740" y="260" width="120" height="68" rx="10" fill="#c8cad0" stroke="#111" stroke-width="6"/>
  <!-- Side straps -->
  <rect x="390" y="380" width="100" height="32" rx="10" fill="#c8cad0" stroke="#111" stroke-width="5"/>
  <rect x="1110" y="380" width="100" height="32" rx="10" fill="#c8cad0" stroke="#111" stroke-width="5"/>

  <!-- Visor / lens panel -->
  <rect x="520" y="348" width="560" height="196" rx="22" fill="#0d0f14" stroke="#111" stroke-width="6"/>
  <!-- Lens sheen lines (toon highlight) -->
  <line x1="540" y1="360" x2="600" y2="400" stroke="rgba(95,209,249,0.18)" stroke-width="3" stroke-linecap="round"/>
  <line x1="555" y1="356" x2="620" y2="400" stroke="rgba(95,209,249,0.10)" stroke-width="2" stroke-linecap="round"/>

  <!-- Cyan edge glow on visor -->
  <rect x="520" y="348" width="560" height="196" rx="22" fill="none" stroke="#5fd1f9" stroke-width="3" opacity="0.7" filter="url(#glow-cyan)"/>

  <!-- Vulkan logo on visor - stylized dragon/diamond -->
  <!-- Diamond outer shape -->
  <polygon points="800,380 870,430 800,510 730,430" fill="#c0392b" stroke="#111" stroke-width="5" filter="url(#glow-red)"/>
  <!-- Diamond inner highlight -->
  <polygon points="800,395 850,430 800,490 750,430" fill="#e74c3c" stroke="none"/>
  <!-- Dragon head shape inside - simplified toon dragon -->
  <polygon points="800,408 835,432 820,468 800,478 780,468 765,432" fill="#c0392b" stroke="#111" stroke-width="3"/>
  <!-- Dragon eye -->
  <circle cx="788" cy="440" r="6" fill="#ff6b35"/>
  <circle cx="790" cy="439" r="3" fill="#111"/>
  <!-- Dragon horns -->
  <polygon points="790,414 780,398 800,408" fill="#e74c3c" stroke="#111" stroke-width="2"/>
  <polygon points="810,414 820,398 800,408" fill="#e74c3c" stroke="#111" stroke-width="2"/>
  <!-- V letter below (Vulkan V) -->
  <text x="800" y="510" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#c0392b" stroke="#111" stroke-width="3" paint-order="stroke">vulkan</text>

  <!-- Thick toon outline on entire headset (re-stroke over) -->
  <rect x="480" y="320" width="640" height="280" rx="40" fill="none" stroke="#111" stroke-width="10"/>

  <!-- IPD dial on bottom -->
  <circle cx="800" cy="600" r="18" fill="#c8cad0" stroke="#111" stroke-width="5"/>
  <line x1="800" y1="585" x2="800" y2="615" stroke="#111" stroke-width="3"/>

  <!-- Platform tags bottom left/right -->
  <rect x="300" y="750" width="160" height="44" rx="8" fill="#111" stroke="#e09456" stroke-width="2"/>
  <text x="380" y="778" text-anchor="middle" font-family="monospace" font-size="16" fill="#e09456">OpenGL</text>
  <rect x="480" y="750" width="160" height="44" rx="8" fill="#111" stroke="#c0392b" stroke-width="2"/>
  <text x="560" y="778" text-anchor="middle" font-family="monospace" font-size="16" fill="#c0392b">Vulkan</text>
  <rect x="660" y="750" width="160" height="44" rx="8" fill="#111" stroke="#5fd1f9" stroke-width="2"/>
  <text x="740" y="778" text-anchor="middle" font-family="monospace" font-size="16" fill="#5fd1f9">OpenVR</text>
  <rect x="840" y="750" width="220" height="44" rx="8" fill="#111" stroke="#a78bfa" stroke-width="2"/>
  <text x="950" y="778" text-anchor="middle" font-family="monospace" font-size="16" fill="#a78bfa">Nintendo Switch</text>

  <!-- Title -->
  <text x="800" y="860" text-anchor="middle" font-family="monospace" font-size="20" fill="rgba(232,234,240,0.4)" letter-spacing="6">BASALT VR / XR ENGINE</text>
</svg>
