<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <filter id="sglow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="sarr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="#5fd1f9"/>
    </marker>
    <marker id="sarr-dim" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 8 3.5, 0 7" fill="rgba(224,148,86,0.6)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#05070b"/>
  <defs>
    <pattern id="sg" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(148,163,184,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#sg)"/>

  <!-- === Left: Code editor panel === -->
  <rect x="60" y="80" width="680" height="720" rx="10" fill="#0d1117" stroke="rgba(224,148,86,0.2)" stroke-width="1.5"/>
  <!-- Editor chrome -->
  <rect x="60" y="80" width="680" height="40" rx="10" fill="#1a1d24"/>
  <rect x="60" y="100" width="680" height="20" fill="#1a1d24"/>
  <circle cx="88" cy="100" r="7" fill="#f87171"/>
  <circle cx="112" cy="100" r="7" fill="#fbbf24"/>
  <circle cx="136" cy="100" r="7" fill="#34d399"/>
  <text x="380" y="106" text-anchor="middle" font-family="monospace" font-size="12" fill="#8892a4">economy.as — AngelScript</text>

  <!-- Line numbers -->
  <rect x="60" y="120" width="44" height="680" fill="#0a0c10"/>
  <line x1="104" y1="120" x2="104" y2="800" stroke="rgba(136,146,164,0.15)" stroke-width="1"/>

  <!-- Code content -->
  <!-- Line 1 -->
  <text x="72" y="150" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">1</text>
  <text x="116" y="150" font-family="monospace" font-size="12" fill="#5fd1f9">float</text>
  <text x="162" y="150" font-family="monospace" font-size="12" fill="#e8eaf0"> CalcTaxRevenue(</text>
  <text x="326" y="150" font-family="monospace" font-size="12" fill="#5fd1f9">Province</text>
  <text x="406" y="150" font-family="monospace" font-size="12" fill="#e09456"> @p</text>
  <text x="434" y="150" font-family="monospace" font-size="12" fill="#e8eaf0">,</text>
  <text x="2" y="2" font-family="monospace" font-size="1" fill="none"/>
  <!-- Line 2 -->
  <text x="72" y="170" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">2</text>
  <text x="116" y="170" font-family="monospace" font-size="12" fill="#e8eaf0">               </text>
  <text x="116" y="170" font-family="monospace" font-size="12" fill="#5fd1f9">Nation</text>
  <text x="178" y="170" font-family="monospace" font-size="12" fill="#e09456"> @n</text>
  <text x="204" y="170" font-family="monospace" font-size="12" fill="#e8eaf0">) {</text>
  <!-- Line 3 -->
  <text x="72" y="190" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">3</text>
  <text x="116" y="190" font-family="monospace" font-size="12" fill="#a78bfa">    float</text>
  <text x="186" y="190" font-family="monospace" font-size="12" fill="#e8eaf0"> base = p.pop *</text>
  <text x="360" y="190" font-family="monospace" font-size="12" fill="#34d399"> 0.012f</text>
  <text x="414" y="190" font-family="monospace" font-size="12" fill="#e8eaf0">;</text>
  <!-- Line 4 -->
  <text x="72" y="210" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">4</text>
  <text x="116" y="210" font-family="monospace" font-size="12" fill="#a78bfa">    float</text>
  <text x="186" y="210" font-family="monospace" font-size="12" fill="#e8eaf0"> rate = n.TaxRate(p.economy_tier);</text>
  <!-- Line 5 -->
  <text x="72" y="230" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">5</text>
  <text x="116" y="230" font-family="monospace" font-size="12" fill="#a78bfa">    float</text>
  <text x="186" y="230" font-family="monospace" font-size="12" fill="#e8eaf0"> tariff = (p.trade_volume *</text>
  <text x="474" y="230" font-family="monospace" font-size="12" fill="#34d399"> 0.08f</text>
  <text x="528" y="230" font-family="monospace" font-size="12" fill="#e8eaf0">);</text>
  <!-- cursor line highlight -->
  <rect x="104" y="238" width="636" height="18" rx="2" fill="rgba(95,209,249,0.04)"/>
  <!-- Line 6 -->
  <text x="72" y="252" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">6</text>
  <text x="116" y="252" font-family="monospace" font-size="12" fill="#5fd1f9">    return</text>
  <text x="186" y="252" font-family="monospace" font-size="12" fill="#e8eaf0"> base * rate + tariff;</text>
  <!-- cursor -->
  <rect x="392" y="242" width="2" height="14" fill="#5fd1f9" filter="url(#sglow)"/>
  <!-- Line 7 -->
  <text x="72" y="272" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">7</text>
  <text x="116" y="272" font-family="monospace" font-size="12" fill="#e8eaf0">}</text>

  <!-- Separator -->
  <line x1="104" y1="292" x2="740" y2="292" stroke="rgba(136,146,164,0.1)" stroke-width="1"/>

  <!-- Line 9: event trigger -->
  <text x="72" y="316" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">9</text>
  <text x="116" y="316" font-family="monospace" font-size="12" fill="#8892a4">// trigger: fire if treasury &lt; 0 for 3 turns</text>
  <text x="72" y="336" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">10</text>
  <text x="116" y="336" font-family="monospace" font-size="12" fill="#a78bfa">bool</text>
  <text x="156" y="336" font-family="monospace" font-size="12" fill="#e8eaf0"> BankruptcyTrigger(</text>
  <text x="330" y="336" font-family="monospace" font-size="12" fill="#5fd1f9">Nation</text>
  <text x="390" y="336" font-family="monospace" font-size="12" fill="#e09456"> @n</text>
  <text x="416" y="336" font-family="monospace" font-size="12" fill="#e8eaf0">) {</text>
  <text x="72" y="356" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">11</text>
  <text x="116" y="356" font-family="monospace" font-size="12" fill="#5fd1f9">    return</text>
  <text x="186" y="356" font-family="monospace" font-size="12" fill="#e8eaf0"> n.deficit_turns >=</text>
  <text x="348" y="356" font-family="monospace" font-size="12" fill="#34d399"> 3</text>
  <text x="366" y="356" font-family="monospace" font-size="12" fill="#e8eaf0">;</text>
  <text x="72" y="376" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">12</text>
  <text x="116" y="376" font-family="monospace" font-size="12" fill="#e8eaf0">}</text>

  <!-- Line separator -->
  <line x1="104" y1="396" x2="740" y2="396" stroke="rgba(136,146,164,0.1)" stroke-width="1"/>

  <!-- AI weight function -->
  <text x="72" y="420" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">14</text>
  <text x="116" y="420" font-family="monospace" font-size="12" fill="#8892a4">// AI: weight for declaring war</text>
  <text x="72" y="440" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">15</text>
  <text x="116" y="440" font-family="monospace" font-size="12" fill="#a78bfa">float</text>
  <text x="156" y="440" font-family="monospace" font-size="12" fill="#e8eaf0"> WarWeight(</text>
  <text x="256" y="440" font-family="monospace" font-size="12" fill="#5fd1f9">Nation</text>
  <text x="316" y="440" font-family="monospace" font-size="12" fill="#e09456"> @self</text>
  <text x="366" y="440" font-family="monospace" font-size="12" fill="#e8eaf0">,</text>
  <text x="378" y="440" font-family="monospace" font-size="12" fill="#5fd1f9"> Nation</text>
  <text x="438" y="440" font-family="monospace" font-size="12" fill="#e09456"> @target</text>
  <text x="510" y="440" font-family="monospace" font-size="12" fill="#e8eaf0">) {</text>
  <text x="72" y="460" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">16</text>
  <text x="116" y="460" font-family="monospace" font-size="12" fill="#5fd1f9">    return</text>
  <text x="186" y="460" font-family="monospace" font-size="12" fill="#e8eaf0"> (self.mil_strength / target.mil_strength)</text>
  <text x="72" y="480" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">17</text>
  <text x="116" y="480" font-family="monospace" font-size="12" fill="#e8eaf0">           * self.aggression - self.stability;</text>
  <text x="72" y="500" font-family="monospace" font-size="11" fill="rgba(136,146,164,0.4)">18</text>
  <text x="116" y="500" font-family="monospace" font-size="12" fill="#e8eaf0">}</text>

  <!-- Bottom status bar -->
  <rect x="60" y="780" width="680" height="20" rx="0" fill="#1a1d24"/>
  <text x="116" y="795" font-family="monospace" font-size="10" fill="#34d399">● compiled  </text>
  <text x="220" y="795" font-family="monospace" font-size="10" fill="#8892a4">economy.as  |  AngelScript  |  UTF-8  |  Ln 6, Col 23</text>

  <!-- === Right: Module graph === -->
  <!-- Module nodes -->
  <!-- economy.as -->
  <rect x="860" y="120" width="180" height="60" rx="8" fill="#0d1117" stroke="#e09456" stroke-width="2" filter="url(#sglow)"/>
  <text x="950" y="146" text-anchor="middle" font-family="monospace" font-size="13" fill="#e09456">economy.as</text>
  <text x="950" y="164" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">CalcTaxRevenue</text>

  <!-- ai.as -->
  <rect x="1100" y="120" width="160" height="60" rx="8" fill="#0d1117" stroke="#a78bfa" stroke-width="2"/>
  <text x="1180" y="146" text-anchor="middle" font-family="monospace" font-size="13" fill="#a78bfa">ai.as</text>
  <text x="1180" y="164" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">WarWeight, DiplomacyWeight</text>

  <!-- events.as -->
  <rect x="860" y="280" width="180" height="60" rx="8" fill="#0d1117" stroke="#5fd1f9" stroke-width="2"/>
  <text x="950" y="306" text-anchor="middle" font-family="monospace" font-size="13" fill="#5fd1f9">events.as</text>
  <text x="950" y="324" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">BankruptcyTrigger, WarEvent</text>

  <!-- scenario.as -->
  <rect x="1100" y="280" width="180" height="60" rx="8" fill="#0d1117" stroke="#34d399" stroke-width="2"/>
  <text x="1190" y="306" text-anchor="middle" font-family="monospace" font-size="13" fill="#34d399">scenario.as</text>
  <text x="1190" y="324" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">OnStart, PlaceNations</text>

  <!-- types.as (shared) -->
  <rect x="980" y="440" width="180" height="60" rx="8" fill="#0d1117" stroke="rgba(224,148,86,0.5)" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1070" y="466" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(224,148,86,0.7)">types.as</text>
  <text x="1070" y="484" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">Province, Nation, Ledger</text>

  <!-- C++ engine (registered API) -->
  <rect x="920" y="590" width="300" height="70" rx="8" fill="#1a1d24" stroke="rgba(95,209,249,0.4)" stroke-width="1.5"/>
  <text x="1070" y="620" text-anchor="middle" font-family="monospace" font-size="13" fill="#5fd1f9">C++ Engine</text>
  <text x="1070" y="642" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">registered types &amp; callbacks</text>

  <!-- Bytecode cache -->
  <rect x="1340" y="400" width="180" height="60" rx="8" fill="#0d1117" stroke="rgba(136,146,164,0.3)" stroke-width="1.5"/>
  <text x="1430" y="426" text-anchor="middle" font-family="monospace" font-size="12" fill="#8892a4">bytecode</text>
  <text x="1430" y="446" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(136,146,164,0.6)">.asc cache</text>

  <!-- import arrows between modules -->
  <line x1="950" y1="340" x2="1000" y2="440" stroke="rgba(224,148,86,0.5)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sarr-dim)"/>
  <line x1="1180" y1="340" x2="1090" y2="440" stroke="rgba(224,148,86,0.5)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sarr-dim)"/>
  <line x1="950" y1="180" x2="990" y2="440" stroke="rgba(224,148,86,0.4)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sarr-dim)"/>
  <line x1="1180" y1="180" x2="1100" y2="440" stroke="rgba(224,148,86,0.4)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#sarr-dim)"/>
  <!-- import labels -->
  <text x="958" y="398" font-family="monospace" font-size="9" fill="rgba(224,148,86,0.5)">import</text>

  <!-- C++ binding arrows -->
  <line x1="1000" y1="500" x2="1040" y2="590" stroke="#5fd1f9" stroke-width="1.5" marker-end="url(#sarr)"/>
  <line x1="1100" y1="500" x2="1080" y2="590" stroke="#5fd1f9" stroke-width="1.5" marker-end="url(#sarr)"/>

  <!-- compile → cache arrow -->
  <line x1="1160" y1="470" x2="1340" y2="430" stroke="rgba(136,146,164,0.3)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="1260" y="448" font-family="monospace" font-size="9" fill="rgba(136,146,164,0.5)">compile</text>

  <!-- AngelScript VM badge -->
  <rect x="1300" y="560" width="220" height="60" rx="8" fill="#1a1d24" stroke="rgba(224,148,86,0.35)" stroke-width="1.5"/>
  <text x="1410" y="588" text-anchor="middle" font-family="monospace" font-size="13" fill="#e09456">AngelScript VM</text>
  <text x="1410" y="606" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">statically typed · bytecode</text>

  <text x="800" y="855" text-anchor="middle" font-family="monospace" font-size="17" fill="rgba(95,209,249,0.3)" letter-spacing="4">TLC SCRIPTING ENGINE</text>
</svg>
