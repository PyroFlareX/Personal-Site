<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <marker id="dep" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5fd1f9"/>
    </marker>
    <marker id="dep-dim" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="rgba(95,209,249,0.4)"/>
    </marker>
    <filter id="jglow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#05070b"/>
  <defs>
    <pattern id="jgrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(148,163,184,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#jgrid)"/>

  <!-- Thread lane labels and tracks -->
  <!-- Lane Y positions: 180, 320, 460, 600 (height 80 each) -->

  <!-- Time axis -->
  <line x1="200" y1="760" x2="1520" y2="760" stroke="rgba(136,146,164,0.3)" stroke-width="1.5"/>
  <text x="860" y="790" text-anchor="middle" font-family="monospace" font-size="12" fill="#8892a4" letter-spacing="2">time →</text>
  <!-- Tick marks -->
  <line x1="380" y1="755" x2="380" y2="765" stroke="rgba(136,146,164,0.3)" stroke-width="1"/>
  <line x1="620" y1="755" x2="620" y2="765" stroke="rgba(136,146,164,0.3)" stroke-width="1"/>
  <line x1="860" y1="755" x2="860" y2="765" stroke="rgba(136,146,164,0.3)" stroke-width="1"/>
  <line x1="1100" y1="755" x2="1100" y2="765" stroke="rgba(136,146,164,0.3)" stroke-width="1"/>
  <line x1="1340" y1="755" x2="1340" y2="765" stroke="rgba(136,146,164,0.3)" stroke-width="1"/>

  <!-- === Thread 0 === -->
  <rect x="60" y="150" width="140" height="80" rx="6" fill="#0d1117" stroke="rgba(224,148,86,0.3)" stroke-width="1"/>
  <text x="130" y="186" text-anchor="middle" font-family="monospace" font-size="12" fill="#e09456">Thread 0</text>
  <text x="130" y="206" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">main + steal</text>
  <!-- Lane track -->
  <rect x="210" y="172" width="1360" height="36" rx="4" fill="rgba(224,148,86,0.04)" stroke="rgba(224,148,86,0.1)" stroke-width="1"/>
  <!-- Jobs on Thread 0 -->
  <rect x="220" y="175" width="180" height="30" rx="4" fill="#e09456" opacity="0.9" filter="url(#jglow)"/>
  <text x="310" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">dispatch</text>
  <rect x="430" y="175" width="240" height="30" rx="4" fill="#e09456" opacity="0.85"/>
  <text x="550" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">province[0..127]</text>
  <rect x="900" y="175" width="200" height="30" rx="4" fill="#e09456" opacity="0.85"/>
  <text x="1000" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">reduce merge</text>
  <rect x="1140" y="175" width="180" height="30" rx="4" fill="rgba(224,148,86,0.4)" opacity="0.9"/>
  <text x="1230" y="195" text-anchor="middle" font-family="monospace" font-size="11" fill="#e09456">render prep</text>

  <!-- === Thread 1 === -->
  <rect x="60" y="290" width="140" height="80" rx="6" fill="#0d1117" stroke="rgba(95,209,249,0.3)" stroke-width="1"/>
  <text x="130" y="326" text-anchor="middle" font-family="monospace" font-size="12" fill="#5fd1f9">Thread 1</text>
  <text x="130" y="346" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">worker</text>
  <rect x="210" y="312" width="1360" height="36" rx="4" fill="rgba(95,209,249,0.03)" stroke="rgba(95,209,249,0.08)" stroke-width="1"/>
  <rect x="430" y="315" width="220" height="30" rx="4" fill="#5fd1f9" opacity="0.85"/>
  <text x="540" y="335" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">province[128..255]</text>
  <rect x="700" y="315" width="160" height="30" rx="4" fill="#5fd1f9" opacity="0.75"/>
  <text x="780" y="335" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">AI:nation[0]</text>
  <rect x="1140" y="315" width="180" height="30" rx="4" fill="rgba(95,209,249,0.4)" opacity="0.9"/>
  <text x="1230" y="335" text-anchor="middle" font-family="monospace" font-size="11" fill="#5fd1f9">draw sort</text>

  <!-- === Thread 2 === -->
  <rect x="60" y="430" width="140" height="80" rx="6" fill="#0d1117" stroke="rgba(167,139,250,0.3)" stroke-width="1"/>
  <text x="130" y="466" text-anchor="middle" font-family="monospace" font-size="12" fill="#a78bfa">Thread 2</text>
  <text x="130" y="486" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">worker</text>
  <rect x="210" y="452" width="1360" height="36" rx="4" fill="rgba(167,139,250,0.03)" stroke="rgba(167,139,250,0.08)" stroke-width="1"/>
  <rect x="430" y="455" width="200" height="30" rx="4" fill="#a78bfa" opacity="0.85"/>
  <text x="530" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">province[256..383]</text>
  <rect x="700" y="455" width="160" height="30" rx="4" fill="#a78bfa" opacity="0.75"/>
  <text x="780" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">AI:nation[1]</text>
  <!-- steal from T3 -->
  <rect x="920" y="455" width="120" height="30" rx="4" fill="rgba(167,139,250,0.5)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="980" y="475" text-anchor="middle" font-family="monospace" font-size="10" fill="#a78bfa">steal→T3</text>
  <rect x="1140" y="455" width="180" height="30" rx="4" fill="rgba(167,139,250,0.4)"/>
  <text x="1230" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa">uniform buf</text>

  <!-- === Thread 3 === -->
  <rect x="60" y="570" width="140" height="80" rx="6" fill="#0d1117" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
  <text x="130" y="606" text-anchor="middle" font-family="monospace" font-size="12" fill="#34d399">Thread 3</text>
  <text x="130" y="626" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">worker</text>
  <rect x="210" y="592" width="1360" height="36" rx="4" fill="rgba(52,211,153,0.03)" stroke="rgba(52,211,153,0.08)" stroke-width="1"/>
  <rect x="430" y="595" width="180" height="30" rx="4" fill="#34d399" opacity="0.85"/>
  <text x="520" y="615" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">trade[0..63]</text>
  <rect x="700" y="595" width="160" height="30" rx="4" fill="#34d399" opacity="0.75"/>
  <text x="780" y="615" text-anchor="middle" font-family="monospace" font-size="11" fill="#05070b">event eval</text>
  <!-- this one got stolen -->
  <rect x="1140" y="595" width="180" height="30" rx="4" fill="rgba(52,211,153,0.4)"/>
  <text x="1230" y="615" text-anchor="middle" font-family="monospace" font-size="11" fill="#34d399">audio jobs</text>

  <!-- Dependency arrows (vertical, phase boundaries) -->
  <!-- End of province batch → reduce merge -->
  <line x1="900" y1="205" x2="900" y2="310" stroke="#5fd1f9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#dep)"/>
  <line x1="900" y1="345" x2="900" y2="450" stroke="#5fd1f9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#dep)"/>
  <line x1="900" y1="485" x2="900" y2="590" stroke="#5fd1f9" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#dep)"/>
  <!-- counter=0 label -->
  <rect x="858" y="240" width="92" height="22" rx="4" fill="#0d1117" stroke="rgba(95,209,249,0.4)" stroke-width="1"/>
  <text x="904" y="256" text-anchor="middle" font-family="monospace" font-size="10" fill="#5fd1f9">ctr → 0</text>
  <!-- Reduce → render prep -->
  <line x1="1100" y1="190" x2="1140" y2="190" stroke="rgba(224,148,86,0.5)" stroke-width="1.5" marker-end="url(#dep-dim)"/>
  <line x1="1100" y1="330" x2="1140" y2="330" stroke="rgba(95,209,249,0.4)" stroke-width="1.5" marker-end="url(#dep-dim)"/>

  <!-- Phase labels -->
  <text x="540" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(224,148,86,0.5)" letter-spacing="1">SIMULATION BATCH</text>
  <line x1="420" y1="148" x2="870" y2="148" stroke="rgba(224,148,86,0.2)" stroke-width="1"/>
  <text x="780" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(95,209,249,0.5)" letter-spacing="1">AI BATCH</text>
  <text x="1230" y="140" text-anchor="middle" font-family="monospace" font-size="11" fill="rgba(167,139,250,0.5)" letter-spacing="1">RENDER PREP</text>
  <line x1="1130" y1="148" x2="1330" y2="148" stroke="rgba(167,139,250,0.2)" stroke-width="1"/>

  <!-- Ring buffer icon top right -->
  <g transform="translate(1440, 80)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="rgba(224,148,86,0.3)" stroke-width="8"/>
    <circle cx="0" cy="-52" r="7" fill="#e09456"/>
    <circle cx="37" cy="-37" r="7" fill="#e09456" opacity="0.7"/>
    <circle cx="52" cy="0" r="7" fill="#e09456" opacity="0.5"/>
    <circle cx="37" cy="37" r="7" fill="#8892a4" opacity="0.3"/>
    <circle cx="0" cy="52" r="7" fill="#8892a4" opacity="0.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="10" fill="#8892a4">ring buf</text>
  </g>

  <text x="800" y="855" text-anchor="middle" font-family="monospace" font-size="17" fill="rgba(224,148,86,0.3)" letter-spacing="4">MULTITHREADED JOB SYSTEM</text>
</svg>
