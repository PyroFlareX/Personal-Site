<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#0c1017"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(148,163,184,0.045)" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#5fd1f9"/>
    </marker>
    <marker id="arrow-cu" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e09456"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- ── Valve 1 (left dispenser) ── -->
  <rect x="260" y="180" width="120" height="70" rx="6" fill="none" stroke="#e09456" stroke-width="3"/>
  <line x1="320" y1="180" x2="320" y2="160" stroke="#e09456" stroke-width="2"/>
  <line x1="290" y1="160" x2="350" y2="160" stroke="#e09456" stroke-width="2"/>
  <line x1="290" y1="155" x2="290" y2="165" stroke="#e09456" stroke-width="2"/>
  <line x1="350" y1="155" x2="350" y2="165" stroke="#e09456" stroke-width="2"/>
  <!-- fluid body -->
  <rect x="275" y="190" width="90" height="50" rx="3" fill="rgba(224,148,86,0.06)"/>

  <!-- ── Valve 2 (center dispenser) ── -->
  <rect x="740" y="140" width="120" height="70" rx="6" fill="none" stroke="#e09456" stroke-width="3"/>
  <line x1="800" y1="140" x2="800" y2="120" stroke="#e09456" stroke-width="2"/>
  <line x1="770" y1="120" x2="830" y2="120" stroke="#e09456" stroke-width="2"/>
  <line x1="770" y1="115" x2="770" y2="125" stroke="#e09456" stroke-width="2"/>
  <line x1="830" y1="115" x2="830" y2="125" stroke="#e09456" stroke-width="2"/>
  <rect x="755" y="150" width="90" height="50" rx="3" fill="rgba(224,148,86,0.06)"/>

  <!-- ── Valve 3 (right dispenser) ── -->
  <rect x="1220" y="180" width="120" height="70" rx="6" fill="none" stroke="#e09456" stroke-width="3"/>
  <line x1="1280" y1="180" x2="1280" y2="160" stroke="#e09456" stroke-width="2"/>
  <line x1="1250" y1="160" x2="1310" y2="160" stroke="#e09456" stroke-width="2"/>
  <line x1="1250" y1="155" x2="1250" y2="165" stroke="#e09456" stroke-width="2"/>
  <line x1="1310" y1="155" x2="1310" y2="165" stroke="#e09456" stroke-width="2"/>
  <rect x="1235" y="190" width="90" height="50" rx="3" fill="rgba(224,148,86,0.06)"/>

  <!-- ── Flow lines from valves to mixing chamber ── -->
  <!-- Valve 1 → chamber -->
  <polyline points="320,250 320,400 760,400 760,520" fill="none" stroke="#5fd1f9" stroke-width="2.5" stroke-dasharray="10,5" marker-end="url(#arrow)"/>
  <!-- Valve 2 → chamber -->
  <polyline points="800,210 800,520" fill="none" stroke="#5fd1f9" stroke-width="2.5" stroke-dasharray="10,5" marker-end="url(#arrow)"/>
  <!-- Valve 3 → chamber -->
  <polyline points="1280,250 1280,400 840,400 840,520" fill="none" stroke="#5fd1f9" stroke-width="2.5" stroke-dasharray="10,5" marker-end="url(#arrow)"/>

  <!-- ── Mixing chamber ── -->
  <rect x="680" y="520" width="240" height="160" rx="10" fill="none" stroke="#e09456" stroke-width="3"/>
  <rect x="690" y="530" width="220" height="140" rx="7" fill="rgba(95,209,249,0.04)"/>
  <!-- stir lines -->
  <line x1="720" y1="580" x2="880" y2="580" stroke="rgba(95,209,249,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="720" y1="610" x2="880" y2="610" stroke="rgba(95,209,249,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="720" y1="640" x2="880" y2="640" stroke="rgba(95,209,249,0.3)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- output spout -->
  <line x1="800" y1="680" x2="800" y2="740" stroke="#e09456" stroke-width="3" marker-end="url(#arrow-cu)"/>
  <line x1="780" y1="740" x2="820" y2="740" stroke="#e09456" stroke-width="3"/>

  <!-- ── Flow sensors (circles on lines) ── -->
  <circle cx="320" cy="330" r="16" fill="#0c1017" stroke="#5fd1f9" stroke-width="2"/>
  <circle cx="1280" cy="330" r="16" fill="#0c1017" stroke="#5fd1f9" stroke-width="2"/>
  <circle cx="800" cy="360" r="16" fill="#0c1017" stroke="#5fd1f9" stroke-width="2"/>
  <!-- sensor cross -->
  <line x1="314" y1="330" x2="326" y2="330" stroke="#5fd1f9" stroke-width="1.5"/>
  <line x1="320" y1="324" x2="320" y2="336" stroke="#5fd1f9" stroke-width="1.5"/>
  <line x1="1274" y1="330" x2="1286" y2="330" stroke="#5fd1f9" stroke-width="1.5"/>
  <line x1="1280" y1="324" x2="1280" y2="336" stroke="#5fd1f9" stroke-width="1.5"/>
  <line x1="794" y1="360" x2="806" y2="360" stroke="#5fd1f9" stroke-width="1.5"/>
  <line x1="800" y1="354" x2="800" y2="366" stroke="#5fd1f9" stroke-width="1.5"/>

  <!-- ── Control board ── -->
  <rect x="1060" y="560" width="200" height="140" rx="8" fill="none" stroke="#e09456" stroke-width="2.5"/>
  <rect x="1068" y="568" width="184" height="124" rx="5" fill="rgba(224,148,86,0.03)"/>
  <!-- PCB traces on control board -->
  <polyline points="1080,590 1120,590 1120,610 1180,610" fill="none" stroke="#e09456" stroke-width="1.5"/>
  <polyline points="1080,620 1140,620 1140,640 1180,640" fill="none" stroke="#5fd1f9" stroke-width="1.5"/>
  <polyline points="1080,650 1100,650 1100,670 1180,670" fill="none" stroke="#e09456" stroke-width="1.5"/>
  <!-- MCU chip -->
  <rect x="1190" y="590" width="50" height="50" rx="4" fill="none" stroke="#e09456" stroke-width="2"/>
  <rect x="1196" y="596" width="38" height="38" rx="2" fill="rgba(224,148,86,0.08)"/>
  <!-- pads -->
  <circle cx="1215" cy="660" r="5" fill="#5fd1f9"/>
  <circle cx="1235" cy="660" r="5" fill="#5fd1f9"/>
  <circle cx="1195" cy="660" r="5" fill="#5fd1f9"/>

  <!-- ── Control bus from board to chamber ── -->
  <polyline points="1060,630 920,630 920,600 840,600" fill="none" stroke="#e09456" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrow-cu)"/>

  <!-- ── Stepper motor boxes (under valves) ── -->
  <rect x="265" y="265" width="110" height="50" rx="5" fill="none" stroke="rgba(224,148,86,0.5)" stroke-width="1.5"/>
  <rect x="745" y="225" width="110" height="50" rx="5" fill="none" stroke="rgba(224,148,86,0.5)" stroke-width="1.5"/>
  <rect x="1225" y="265" width="110" height="50" rx="5" fill="none" stroke="rgba(224,148,86,0.5)" stroke-width="1.5"/>
</svg>
